<div class="row g-3 mb-4">
  <div class="col-6 col-md-4 col-lg-2"><div class="metric-card"><span>Profit total</span><h3>${{ summary.profit_total }}</h3></div></div>
  <div class="col-6 col-md-4 col-lg-2"><div class="metric-card"><span>Win rate</span><h3>{{ summary.win_rate }}%</h3></div></div>
  <div class="col-6 col-md-4 col-lg-2"><div class="metric-card"><span>Trades totales</span><h3>{{ summary.total_trades }}</h3></div></div>
  <div class="col-6 col-md-4 col-lg-2"><div class="metric-card"><span>Mejor activo</span><h3>{{ summary.best_asset }}</h3></div></div>
  <div class="col-6 col-md-4 col-lg-2"><div class="metric-card"><span>Peor emoción</span><h3>{{ summary.worst_emotion }}</h3></div></div>
  <div class="col-6 col-md-4 col-lg-2"><div class="metric-card"><span>Profit del mes</span><h3>${{ summary.monthly_profit }}</h3></div></div>
</div>
